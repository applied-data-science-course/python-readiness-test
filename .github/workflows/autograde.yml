name: Autograde

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    # Skip on the template repository itself, where every task is still a stub.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the checks
        run: pytest -v --junitxml=results.xml || true

      - name: Count tasks passed
        id: score
        run: python .github/scripts/score.py results.xml >> "$GITHUB_OUTPUT"

      - name: Record the score on this commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ steps.score.outputs.passed }}' === '${{ steps.score.outputs.total }}' ? 'success' : 'failure',
              description: '${{ steps.score.outputs.passed }}/${{ steps.score.outputs.total }} tasks passed',
              context: 'readiness-score',
            });

      - name: Fail the run unless every task passes
        if: steps.score.outputs.passed != steps.score.outputs.total
        run: |
          echo "${{ steps.score.outputs.passed }}/${{ steps.score.outputs.total }} tasks passed"
          exit 1
